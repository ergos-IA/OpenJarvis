<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>{{TITLE}} · {{BRAND}}</title>
<link rel="icon" href="/jarvis-ui/aifasttrack-mark.svg" type="image/svg+xml">
<style>
@font-face { font-family: "Space Grotesk"; font-weight: 400 700; src: url("/jarvis-ui/space-grotesk.woff2") format("woff2"); }
@font-face { font-family: "Inter"; font-weight: 400 700; src: url("/jarvis-ui/inter.woff2") format("woff2"); }
* { box-sizing: border-box; }
body { margin: 0; background: #080808; color: #d9d9d9; font: 16px/1.7 "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 14px 16px; background: rgba(8,8,8,.88); backdrop-filter: blur(10px); border-bottom: 1px solid #1f1f1f; }
header img { height: 30px; display: block; }
nav { display: flex; flex-wrap: wrap; gap: 4px; }
nav a { color: #9a9a9a; text-decoration: none; font-size: 13px; padding: 6px 10px; border-radius: 8px; }
nav a.on, nav a:hover { color: #fff; background: #161616; }
main { max-width: 780px; margin: 0 auto; padding: 32px 16px 72px; }
h1 { font: 700 clamp(28px, 5vw, 38px)/1.15 "Space Grotesk", sans-serif; color: #fff; margin: 0 0 6px; }
h2 { font: 700 20px/1.3 "Space Grotesk", sans-serif; color: #fff; margin: 34px 0 8px; }
h3 { font: 700 16px/1.4 "Space Grotesk", sans-serif; color: #fff; margin: 20px 0 6px; }
p, li { color: #c8c8c8; }
li { margin: 5px 0; }
a { color: #00d9ff; }
strong { color: #fff; }
.meta { color: #7a7a7a; font-size: 14px; margin-bottom: 24px; }
.box { padding: 14px 16px; border-radius: 12px; border: 1px solid #262626; background: #101010; margin: 16px 0; }
.box.warn { border-color: rgba(255,219,5,.35); background: rgba(255,219,5,.06); }
.box.warn strong { color: #ffdb05; }
.draft { padding: 12px 14px; border-radius: 12px; background: rgba(255,59,100,.08); border: 1px solid rgba(255,59,100,.35); color: #ffb3c3; font-size: 14px; margin-bottom: 22px; }
.ph { color: #ffdb05; background: rgba(255,219,5,.12); padding: 0 4px; border-radius: 4px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; margin: 12px 0; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid #222; vertical-align: top; }
th { color: #fff; font-weight: 600; }
footer { text-align: center; color: #5a5a5a; font-size: 13px; padding: 0 16px 40px; }
</style>
</head>
<body>
<header>
  <a href="/"><img src="/jarvis-ui/aifasttrack-logo.svg" alt="{{BRAND}}"></a>
  <nav>
    <a href="/legal/aviso-legal" class="{{NAV_AVISO}}">Aviso legal</a>
    <a href="/legal/terminos" class="{{NAV_TERMINOS}}">Términos</a>
    <a href="/legal/privacidad" class="{{NAV_PRIVACIDAD}}">Privacidad</a>
    <a href="/legal/cookies" class="{{NAV_COOKIES}}">Cookies</a>
  </nav>
</header>
<main>
  {{DRAFT_BANNER}}
  <h1>{{TITLE}}</h1>
  <p class="meta">Versión {{VERSION}} · Última actualización: {{UPDATED}}</p>
  {{BODY}}
</main>
<footer>{{BRAND}} · Jarvis</footer>
</body>
</html>
