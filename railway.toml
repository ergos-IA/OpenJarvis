# Railway config for OpenJarvis (one service = one person's assistant).
# See deploy/railway/README.md. The volume must be mounted at /data.
[build]
builder = "DOCKERFILE"
dockerfilePath = "deploy/railway/Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
